# CONTROL: identical to dpo_stream_t4.yaml except the learning rate, set to the 5e-6 that
# Soup's catalog DPO recipes ship with LoRA. Question: does a run like this learn anything?
base: Qwen/Qwen2.5-1.5B-Instruct
task: dpo
backend: transformers

data:
  train: ./data/train.jsonl
  format: dpo
  max_length: 1024        # covers 478/500 pairs whole (prompt + longer answer); see audit
  val_split: 0.0          # 0.75.1 default is 0.1, and DPO never evaluates it (see report)

training:
  epochs: 1               # one pass = 63 optimizer steps; the free T4's daily quota sets this
  lr: 5.0e-6              # the catalog recipes' value (see report)
  batch_size: 2
  gradient_accumulation_steps: 4   # effective batch 8 -> 63 optimizer steps per epoch
  warmup_ratio: 0.1
  scheduler: cosine
  weight_decay: 0.0
  max_grad_norm: 1.0
  dpo_beta: 0.1
  seed: 42
  logging_steps: 1
  save_steps: 50
  quantization: none      # fp16 store on a T4 (no bf16 units); 1.5B x 2 B = ~3.1 GB of host RAM
  gradient_checkpointing: true
  stream_layers: true
  stream_source: ram
  stream_buffers: 2
  lora:
    r: 16
    alpha: 32
    dropout: 0.0
    target_modules: auto

output: ./runs/control_recipe_lr
